apiVersion: openshell.managed.openshift.io/v1alpha1
kind: Sandbox
metadata:
  name: ${NAME}
spec:
  autoProviders: false
  image: ${IMAGE}
  command: [bash, -lc, "${SCRIPT}"]
  providerRefs: ${PROVIDER_REFS}
  env:
    OPENSHELL_GATEWAY_ENDPOINT: ${GATEWAY_ENDPOINT}
    OPENSHELL_OIDC_ISSUER: ${OIDC_ISSUER}
    OPENSHELL_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
    OPENSHELL_OIDC_AUDIENCE: ${OIDC_AUDIENCE}
    NAME: ${NAME}
    HOME: /tmp
  sessionOpts:
    approvalMode: auto
    noKeep: true
  tty: false
