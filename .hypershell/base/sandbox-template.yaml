# SandboxTemplate manifest for rosa-agent.
#
# SandboxTemplate carries only image and policy — no provider references,
# environment variables, or credential bindings. Those attach via
# ProviderBinding + SecretSource on the agent_runtime (Phase 4) or via
# ProviderSpec + ProviderBinding (Phase 5). Do NOT add providerRefs, env,
# or sessionOpts here.
#
# JIRA_EMAIL and JIRA_BASE_URL are not secrets and are not injected by the
# template. Pass them at sandbox-creation time via --env or agent_runtime
# parameters.
#
# Policy field notes:
#   - spec.policy is a JSON-encoded string (opaque to the HyperShell API;
#     validated by the OpenShell gateway).
#   - The JSON was produced by applying the openshellctl policyyaml/toproto.go
#     transform rules to policies/default.yaml:
#       filesystem_policy → filesystem (camelCase field names)
#       network_policies  → network array (map key becomes rule name default)
#       port              → uint32 integer
#       binaries[].harness removed (0.1.x rejects it; not present in source)
#   - Enum values (access, protocol, enforcement) are kept as the YAML source
#     strings pending v0.1.3 CLI lint confirmation (MCS-210 AC-4).
#   - sigv4 credential-signing fields camelCased: credentialSigning,
#     signingService, signingRegion.
#   - Current policy has 17 network blocks (MCS-210 counted 15 at assessment
#     time; 2 blocks added since: redhat-registry, s3-blob-storage).
#
# TODO (after SDK rebase MCS-245): run openshell policy lint against this
# JSON to confirm sigv4 field names, wildcard glob syntax (*.foo, **.foo),
# and enum value casing.
apiVersion: openshell.managed.openshift.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: rosa-agent
spec:
  namePrefix: rosa-agent-
  image: quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest
  policy: '{"filesystem":{"includeWorkdir":true,"readOnly":[],"readWrite":["/tmp","/dev/null"]},"network":[{"name":"bedrock-inference-sigv4","endpoints":[{"host":"bedrock-runtime.us-east-2.amazonaws.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce","credentialSigning":"sigv4","signingService":"bedrock","signingRegion":"us-east-2"}],"binaries":[{"path":"/usr/bin/claude"}]},{"name":"github-api","endpoints":[{"host":"api.github.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/local/bin/gh"},{"path":"/usr/bin/git"},{"path":"/usr/bin/claude"}]},{"name":"github-git","endpoints":[{"host":"github.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"},{"host":"codeload.github.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/git"},{"path":"/usr/bin/claude"}]},{"name":"anthropic-api","endpoints":[{"host":"api.anthropic.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"github-assets","endpoints":[{"host":"objects.githubusercontent.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"github-actions","endpoints":[{"host":"actions.githubusercontent.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"},{"host":"*.actions.githubusercontent.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"redhat-docs","endpoints":[{"host":"docs.redhat.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"redhat-registry","endpoints":[{"host":"registry.access.redhat.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/curl"},{"path":"/usr/bin/skopeo"},{"path":"/usr/bin/claude"}]},{"name":"redhat-errata","endpoints":[{"host":"access.redhat.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"},{"host":"security.access.redhat.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/curl"},{"path":"/usr/bin/claude"}]},{"name":"konflux","endpoints":[{"host":"**.stone-prd-rh01.pg1f.p1.openshiftapps.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"},{"host":"**.kflux-prd-rh02.0fk9.p1.openshiftapps.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"},{"host":"**.kflux-prd-rh03.nnv1.p1.openshiftapps.com","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"codecov","endpoints":[{"host":"app.codecov.io","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"prow","endpoints":[{"host":"prow.ci.openshift.org","port":443,"access":"read-only","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/claude"},{"path":"/usr/bin/curl"}]},{"name":"gitlab-cee","endpoints":[{"host":"gitlab.cee.redhat.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"}],"binaries":[{"path":"/usr/bin/git"},{"path":"/usr/local/bin/glab"},{"path":"/usr/bin/claude"}]},{"name":"vertex-ai","endpoints":[{"host":"oauth2.googleapis.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"},{"host":"aiplatform.googleapis.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"},{"host":"*.aiplatform.googleapis.com","port":443,"access":"read-write","protocol":"rest","enforcement":"enforce"},{"host":"aiplatform.us.rep.googleapis.com