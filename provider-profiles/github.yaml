# GitHub provider profile for rosa-agent sandboxes.
#
# Adapted from NVIDIA/OpenShell providers/github.yaml. OpenShell 0.1.x ships no
# built-in profiles, so without this import there is no `github` provider type
# and `provider create --type github` fails with "provider profile not found".
#
# Three deliberate deltas from upstream:
#
#   1. binaries is narrowed, not corrected. Upstream lists
#      [/usr/bin/gh, /usr/local/bin/gh, /usr/bin/git, /usr/local/bin/git] to
#      cover several image layouts. Here gh exists only at /usr/local/bin/gh
#      and git only at /usr/bin/git, so the other two are dropped. binaries
#      matches on exact path and decides which processes may reach these
#      endpoints, so a path absent from the image denies silently rather than
#      failing loudly.
#
#   2. api.github.com uses explicit allow rules, not a read-write preset.
#      With the base policy empty (plan 0014) this profile is now the only
#      GitHub grant. Explicit rules replace the coarse read-write block so
#      that the allow list means exactly what it says — no hidden write paths.
#
#   3. github.com allows POST only to /rosa-agent/*/git-receive-pack.
#      The agent pushes only to its own fork namespace; allowing receive-pack
#      on ** would permit pushing to any repo the token can reach.
#
# Lint and import. `openshell provider profile ...` also works -- it is a
# registered alias for `openshell profile ...` -- but the short form is the
# canonical one:
#   openshell -g <gateway> profile lint   --file provider-profiles/github.yaml
#   openshell -g <gateway> profile import --file provider-profiles/github.yaml --global
#
# Create the provider. The credential is read from the environment so the token
# never appears in a command line or shell history.
#   GH_TOKEN="$(vault kv get -field=github-token osd-sre/rosa-agent)" \
#     openshell -g <gateway> provider create --name rosa-agent-github \
#       --type github --global-profile --credential GH_TOKEN
#
# Use the github-token field: it holds the classic PAT with full repo scope,
# which is the credential that can push. The secret also has
# github-openshift-org-token, a fine-grained PAT -- that one authenticates as
# the bot and can read the forks, but its Contents permission is read-only, so
# every `git push` fails.
#
# Verify the CAPABILITY, not just the identity, before binding a credential.
# Checking `gh api user --jq .login` is not enough: the fine-grained token
# passes that, reports push: true on the repo (because that field describes
# the account, not the token), and still cannot push. The cheap decisive check
# is a dry-run push, which reaches GitHub and reports its verdict:
#   git push --dry-run <fork> HEAD:refs/heads/probe
# A wrong credential is otherwise invisible until a scheduled job fails.

id: github
display_name: GitHub
description: GitHub API and Git operations
category: source_control
credentials:
  - name: api_token
    description: GitHub token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  # REST API — explicit writes only. With the base policy empty (plan 0014)
  # this is now the sole GitHub grant. A read-write preset here would allow
  # POST/PUT/PATCH on any path; the rules below restrict to only the
  # operations the agent actually performs.
  - host: api.github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      # Reads — all REST GET/HEAD/OPTIONS paths
      - allow: { method: GET,     path: "/**" }
      - allow: { method: HEAD,    path: "/**" }
      - allow: { method: OPTIONS, path: "/**" }
      # Fork
      - allow: { method: POST,   path: "/repos/*/*/forks" }
      # Pull requests
      - allow: { method: POST,   path: "/repos/*/*/pulls" }
      - allow: { method: PATCH,  path: "/repos/*/*/pulls/*" }
      # Issues
      - allow: { method: POST,   path: "/repos/*/*/issues" }
      - allow: { method: POST,   path: "/repos/*/*/issues/*/comments" }
      # Labels
      - allow: { method: POST,   path: "/repos/*/*/labels" }
      - allow: { method: POST,   path: "/repos/*/*/issues/*/labels" }
  # GraphQL: read-only enforced at protocol level. gh pr create and gh issue
  # create use GraphQL mutations; those go through this endpoint at query/mutation
  # semantic level. Pure gh api REST calls go through the REST block above.
  - host: api.github.com
    port: 443
    path: /graphql
    protocol: graphql
    access: read-only
    enforcement: enforce
  # Git transport. Smart HTTP tunnels both directions over POST, which the
  # read-only preset blocks, so the two service endpoints are named
  # explicitly rather than taking a blanket read-write.
  #   git-upload-pack  -> clone and fetch (any repo the token can read)
  #   git-receive-pack -> push, scoped to the bot's own fork namespace only
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET,     path: "/**" }
      - allow: { method: HEAD,    path: "/**" }
      - allow: { method: OPTIONS, path: "/**" }
      - allow: { method: POST,    path: "/**/git-upload-pack" }
      # Push only to rosa-agent's own fork namespace. * matches exactly one
      # path segment (repo name). rosa-agent/org/repo would need ** and is denied.
      - allow: { method: POST,    path: "/rosa-agent/*/git-receive-pack" }
  # Clone redirects here for pack data. Read-only; no POST needed.
  - host: codeload.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
# Profile-level: this list applies to every endpoint above, so it is kept to
# the binaries that actually reach GitHub. curl is deliberately absent —
# the asset and Actions hosts it needs are in provider-profiles/ci-pipelines.yaml,
# because adding curl here would also grant it api.github.com and github.com.
binaries: [/usr/local/bin/gh, /usr/bin/git, /usr/bin/claude]
