apiVersion: openshell.managed.openshift.io/v1alpha1
kind: Sandbox
metadata:
  name: ${NAME}
spec:
  autoProviders: false
  image: quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest
  command:
    - claude
    - --dangerously-skip-permissions
    - --print
    - ${PROMPT}
  providerRefs:
    - name: rosa-agent-vertex
    - name: rosa-agent-github
    # Job-specific providers are added per job (see each job's cron manifest):
    #   sop-improve:      ro-go_modules
    #   ops-sop-pr-review: ro-ci_pipelines
    #   image-vuln-check: ro-go_modules, ro-image_inspect, ro-redhat_errata
  env:
    JIRA_EMAIL: sd-sre-platform+rosa-agent@redhat.com
    JIRA_BASE_URL: https://redhat.atlassian.net
  sessionOpts:
    approvalMode: auto
    noKeep: true
  tty: true
