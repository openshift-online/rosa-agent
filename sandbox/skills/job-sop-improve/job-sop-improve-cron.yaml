# Temporarily deployed directly to cluster rather than via Konflux.
# Konflux build clusters cannot reach the OIDC endpoint for Hypershell,
# so this CronJob is applied manually until that connectivity is resolved.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rosa-agent-bot-0
  namespace: rosa-agent-stage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rosa-agent-bot-0
  namespace: rosa-agent-stage
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openshell-oidc"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rosa-agent-bot-0
  namespace: rosa-agent-stage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rosa-agent-bot-0
subjects:
  - kind: ServiceAccount
    name: rosa-agent-bot-0
    namespace: rosa-agent-stage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sop-improve
  namespace: rosa-agent-stage
spec:
  schedule: "0 22 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: rosa-agent-bot-0
          containers:
            - name: sop-improve
              image: quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail

                  openshellctl gateway add "${OPENSHELL_GATEWAY_ENDPOINT}" --name rosa-agent

                  openshellctl doctor --provider rosa-agent-github

                  openshellctl sandbox create \
                    --replace \
                    -f /sandbox/templates/noninteractive.yaml \
                    -p NAME="${NAME}" \
                    -p PROMPT="${PROMPT}"
              env:
                - name: HOME
                  value: /tmp
                - name: OPENSHELL_GATEWAY_ENDPOINT
                  value: "https://gw-openshell-02c8f9e0680fb903.hyp2-spoke1.infra.hypershell.app:443"
                - name: OPENSHELL_OIDC_ISSUER
                  value: "https://keycloak.hyp2.infra.hypershell.app/realms/hypershell"
                - name: OPENSHELL_OIDC_CLIENT_ID
                  value: "hs-sa-3L1eUHbsHIb3IC4dPUGBKvCCyZJ-3L1ectgVPHVUh1EFS7NvLC43FB9"
                - name: OPENSHELL_OIDC_AUDIENCE
                  value: "rosa-agent-3L1eUHbsHIb3IC4dPUGBKvCCyZJ"
                - name: NAME
                  value: sop-improve
                - name: PROMPT
                  value: "/job-sop-improve"
                - name: OPENSHELL_OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: openshell-oidc
                      key: OPENSHELL_OIDC_CLIENT_SECRET
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: Never
