# Temporarily deployed directly to cluster rather than via Konflux.
# Konflux build clusters cannot reach the OIDC endpoint for Hypershell,
# so this CronJob is applied manually until that connectivity is resolved.
# See sandbox/skills/job-sop-improve/job-sop-improve-cron.yaml for the
# sibling job this manifest mirrors.
#
# Checks multiple images/repos as one CronJob fanned out via an Indexed Job:
# `completionMode: Indexed` + `completions`/`parallelism` gives each target
# its own Pod, its own sandbox, and its own `claude` invocation. Kubernetes
# injects JOB_COMPLETION_INDEX into every container automatically; each pod
# uses it to look up its own entry in the image-vuln-check-targets ConfigMap
# below. `backoffLimitPerIndex` (not the job-wide `backoffLimit`) scopes
# retries to a single index, so one target failing doesn't terminate its
# siblings' still-running pods.
#
# To add a target: append an entry to the ConfigMap's JSON array AND bump
# `completions`/`parallelism` to match the new array length - nothing else
# needs to change.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rosa-agent-bot-1
  namespace: rosa-agent-stage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rosa-agent-bot-1
  namespace: rosa-agent-stage
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openshell-oidc"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rosa-agent-bot-1
  namespace: rosa-agent-stage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rosa-agent-bot-1
subjects:
  - kind: ServiceAccount
    name: rosa-agent-bot-1
    namespace: rosa-agent-stage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-vuln-check-targets
  namespace: rosa-agent-stage
data:
  # Index N here is read by the pod whose JOB_COMPLETION_INDEX == N. Keep
  # this array's length in sync with the CronJob's completions/parallelism.
  targets.json: |
    [
      {
        "image": "quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest",
        "repository": "openshift-online/rosa-agent"
      },
      {
        "image": "quay.io/redhat-services-prod/openshift/ocm-container:latest",
        "repository": "openshift/ocm-container"
      }
    ]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-vuln-check
  namespace: rosa-agent-stage
spec:
  schedule: "7 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One Pod per target in the image-vuln-check-targets ConfigMap above -
      # bump both to match that array's length.
      completions: 2
      parallelism: 2
      completionMode: Indexed
      activeDeadlineSeconds: 3600
      # Per-index retry budget, not job-wide: one target exhausting its
      # retries marks only that index failed, without touching sibling
      # pods still in flight. Leaving the job-wide `backoffLimit` unset is
      # intentional - when backoffLimitPerIndex is set, Kubernetes defaults
      # backoffLimit to MaxInt32, which is what we want here (no separate,
      # lower job-wide cap to race against the per-index one).
      backoffLimitPerIndex: 0
      template:
        spec:
          serviceAccountName: rosa-agent-bot-1
          containers:
            - name: image-vuln-check
              image: quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail

                  echo "=== Step 0: Resolve this Pod's target (index ${JOB_COMPLETION_INDEX}) ==="
                  TARGETS_FILE=/etc/image-vuln-check/targets.json
                  TARGET_IMAGE=$(jq -r --argjson i "${JOB_COMPLETION_INDEX}" '.[$i].image // empty' "${TARGETS_FILE}")
                  TARGET_REPOSITORY=$(jq -r --argjson i "${JOB_COMPLETION_INDEX}" '.[$i].repository // empty' "${TARGETS_FILE}")
                  if [ -z "${TARGET_IMAGE}" ] || [ -z "${TARGET_REPOSITORY}" ]; then
                    echo "No target at index ${JOB_COMPLETION_INDEX} in ${TARGETS_FILE}" >&2
                    exit 1
                  fi
                  NAME="image-vuln-check-${JOB_COMPLETION_INDEX}"
                  PROMPT="/job-image-vuln-check --image ${TARGET_IMAGE} --repository ${TARGET_REPOSITORY}"
                  echo "TARGET_IMAGE=${TARGET_IMAGE}"
                  echo "TARGET_REPOSITORY=${TARGET_REPOSITORY}"
                  echo "NAME=${NAME}"

                  # openshellctl reads OPENSHELL_GATEWAY_ENDPOINT, OPENSHELL_OIDC_CLIENT_ID,
                  # and OPENSHELL_OIDC_CLIENT_SECRET directly from the environment (see
                  # env: below) — no manual metadata.json, DNS probe, curl token mint, or
                  # python token writer needed. `gateway add` authenticates via client
                  # credentials as part of registration and sets the gateway active.
                  # OPENSHELL_OIDC_ISSUER/OPENSHELL_OIDC_AUDIENCE are deliberately NOT
                  # set: leaving them unset makes `gateway add` discover both from
                  # "${OPENSHELL_GATEWAY_ENDPOINT}/auth/oidc-config" and register
                  # exactly what the gateway reports, so `doctor`'s later OIDC config
                  # match check compares the gateway against itself instead of
                  # against a hardcoded value that could drift (review feedback,
                  # rosa-agent#94).
                  # HOME=/tmp is this Pod's own filesystem, so concurrent sibling pods
                  # (one per target index) never share or race this registration.
                  echo "=== Step 1: Register the gateway and authenticate ==="
                  openshellctl gateway add "${OPENSHELL_GATEWAY_ENDPOINT}" --name "${OPENSHELL_GATEWAY}"

                  # Confirms reachability, a valid/current token, and (since
                  # providerRefs are passed below) that every provider this job
                  # needs actually exists — before any sandbox is created.
                  echo "=== Step 2: Preflight (doctor) ==="
                  openshellctl doctor \
                    --provider rosa-agent-github \
                    --provider rosa-agent-jira \
                    --provider rosa-general-vertex

                  # --replace deletes-and-waits-for-gone any sandbox left over from a
                  # prior run (e.g. a timed-out pod) before creating, surfacing a real
                  # error instead of silently racing a deletion still in flight.
                  echo "=== Step 3: Replace and create the sandbox ==="
                  openshellctl sandbox create \
                    --replace \
                    --name "${NAME}" \
                    --from "${IMAGE}" \
                    --provider rosa-agent-github \
                    --provider rosa-agent-jira \
                    --provider rosa-general-vertex \
                    --env ANTHROPIC_API_KEY=unused \
                    --env ANTHROPIC_BASE_URL=https://inference.local \
                    --env JIRA_EMAIL="${JIRA_EMAIL}" \
                    --env JIRA_BASE_URL="${JIRA_BASE_URL}" \
                    --no-keep \
                    --no-tty \
                    -- claude --dangerously-skip-permissions --print "${PROMPT}"
              env:
                - name: HOME
                  value: /tmp
                - name: OPENSHELL_GATEWAY
                  value: "ROSA Agentic Devx-rosa-agent"
                - name: OPENSHELL_GATEWAY_ENDPOINT
                  value: "https://gw-openshell-46b2dff2b7232948.openshell.stage.devshift.net:443"
                - name: OPENSHELL_OIDC_CLIENT_ID
                  value: "hs-sa-3I94YwZezpdI4AEzuxtJnsVYGVt-3J3ccZA4F2wyrrGaIHorqtywaiL"
                - name: IMAGE
                  # Sandbox base image (this job's own tooling), not the
                  # per-target image being scanned for CVEs - that's
                  # TARGET_IMAGE, set per-index in the script above.
                  value: "quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest"
                - name: JIRA_EMAIL
                  value: "sd-sre-platform+rosa-agent@redhat.com"
                - name: JIRA_BASE_URL
                  value: "https://redhat.atlassian.net"
                - name: OPENSHELL_OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: openshell-oidc
                      key: OPENSHELL_OIDC_CLIENT_SECRET
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: targets
                  mountPath: /etc/image-vuln-check
                  readOnly: true
          volumes:
            - name: targets
              configMap:
                name: image-vuln-check-targets
          restartPolicy: Never
