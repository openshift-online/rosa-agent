# Temporarily deployed directly to cluster rather than via Konflux.
# Konflux build clusters cannot reach the OIDC endpoint for Hypershell,
# so this CronJob is applied manually until that connectivity is resolved.
#
# See sandbox/skills/job-sop-improve/job-sop-improve-cron.yaml for the
# sibling job this manifest mirrors. Each job gets its own
# rosa-agent-bot-N ServiceAccount identity in rosa-agent-stage
# (bot-0 = sop-improve, bot-1 = image-vuln-check, bot-2 = this job).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rosa-agent-bot-2
  namespace: rosa-agent-stage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rosa-agent-bot-2
  namespace: rosa-agent-stage
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openshell-oidc"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rosa-agent-bot-2
  namespace: rosa-agent-stage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rosa-agent-bot-2
subjects:
  - kind: ServiceAccount
    name: rosa-agent-bot-2
    namespace: rosa-agent-stage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-sop-pr-review
  namespace: rosa-agent-stage
spec:
  # Fridays at 22:00 UTC = 12:00 HST (HST is UTC-10 year-round, no DST).
  schedule: "0 22 * * 5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: rosa-agent-bot-2
          containers:
            - name: ops-sop-pr-review
              image: quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail

                  openshellctl gateway add "${OPENSHELL_GATEWAY_ENDPOINT}" --name rosa-agent

                  openshellctl doctor --provider rosa-agent-github

                  openshellctl sandbox create \
                    --replace \
                    -f /sandbox/templates/noninteractive.yaml \
                    -p NAME="${NAME}" \
                    -p PROMPT="${PROMPT}"
              env:
                - name: HOME
                  value: /tmp
                - name: OPENSHELL_GATEWAY_ENDPOINT
                  value: "PLACEHOLDER_GATEWAY_ENDPOINT"
                - name: OPENSHELL_OIDC_ISSUER
                  value: "PLACEHOLDER_OIDC_ISSUER"
                - name: OPENSHELL_OIDC_CLIENT_ID
                  value: "PLACEHOLDER_OIDC_CLIENT_ID"
                - name: OPENSHELL_OIDC_AUDIENCE
                  value: "PLACEHOLDER_OIDC_AUDIENCE"
                - name: NAME
                  value: ops-sop-pr-review
                - name: PROMPT
                  value: "/job-ops-sop-pr-review"
                - name: OPENSHELL_OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: openshell-oidc
                      key: OPENSHELL_OIDC_CLIENT_SECRET
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: Never
